<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/common :: head('Games')}"></head>

<body>

    <header th:replace="~{layouts/common :: header}"></header>

    <main class="container">

        <section class="py-4">

            <h1 class="display-6 fw-bold">Game Management</h1>

            <p class="lead">
                Welcome back,
                <span th:text="${username}">gameforge</span>.
            </p>

            <a class="btn btn-primary mt-3"
               th:href="@{/products/create}">
                Add Game
            </a>

            <hr class="my-4">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
			<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Shows a message if there are no games -->
            <div th:if="${#lists.isEmpty(products)}"
                 class="alert alert-info">
                No games have been added yet.
            </div>

            <!-- Displays all games from the database -->
            <div th:if="${!#lists.isEmpty(products)}"
                 class="row">

                <div class="col-md-6 mb-4"
                     th:each="product : ${products}">

                    <div class="card h-100">

                        <div class="card-body">

                            <h4 class="card-title"
                                th:text="${product.title}">
                                Game Title
                            </h4>

                            <p>
                                <strong>Price:</strong>
                                $<span th:text="${product.price}"></span>
                            </p>

                            <p>
                                <strong>Release Date:</strong>
                                <span th:text="${product.releaseDate}"></span>
                            </p>

                            <p>
                                <strong>Category:</strong>
                                <span th:text="${product.category}"></span>
                            </p>

                            <p>
                                <strong>Description:</strong>
                                <span th:text="${product.description}"></span>
                            </p>

                            <p>
                                <strong>Platforms:</strong>

                                <span th:each="platform, stat : ${product.platforms}">
                                    <span th:text="${platform}"></span>
                                    <span th:if="${!stat.last}">, </span>
                                </span>
                            </p>
							
							<div class="mt-3">

							    <a class="btn btn-warning btn-sm"
							       th:href="@{/products/edit/{id}(id=${product.productId})}">
							        Edit
							    </a>

							    <form class="d-inline"
								      th:action="@{/products/delete/{id}(id=${product.productId})}"
								      method="post"
								      onsubmit="return confirm('Delete this game? This cannot be undone.');">
								    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
								</form>
							</div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer th:replace="~{layouts/common :: footer}"></footer>

</body>
</html>
