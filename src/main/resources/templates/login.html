<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/common :: head('Login')}"></head>

<body>
    <header th:replace="~{layouts/common :: header}"></header>

    <main class="container">
        <section class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h2 mb-3">Sign in to GameForge</h1>
                        <p class="text-muted">
                            Sign in using your registered GameForge account.
                        </p>

                        <div class="alert alert-danger" th:if="${param.error}" role="alert">
                            Invalid username or password. Please try again.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control" id="username" name="username"
                                       type="text" autocomplete="username" autofocus required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control" id="password" name="password"
                                       type="password" autocomplete="current-password" required>
                            </div>

                            <button class="btn btn-primary w-100" type="submit">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{layouts/common :: footer}"></footer>
</body>
</html>
