<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
											layout:decorate="layouts/defaultTemplate">

<head th:replace="~{layouts/common :: head('Register')}"></head>

<meta charset="UTF-8">
<title>Registration Page</title>
</head>
<body>
	<header th:replace="~{layouts/common :: header}"></header>
		<section class="text-center py-5">
			<div layout:fragment="content" >
				<h1 class="display-4 fw-bold mb-3">
	                Registration
	            </h1>
	            <br>
					<form action ="#" th:action="@{doRegister}" th:object="${userModel}" method="post">
						<table class="mx-auto">
							<tr>
								<td>First Name:</td><td><input type="text" th:field="*{firstName}"></td><td><h5 style="color:red" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First Name Error</h5></td>
							</tr>
							<tr>
								<td>Last Name:</td><td><input type="text" th:field="*{lastName}"></td><td><h5 style="color:red" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last Name Error</h5></td>
							</tr>
							<tr>
								<td>Email:</td><td><input type="text" th:field="*{emailAddress}"></td><td><h5 style="color:red" th:if="${#fields.hasErrors('emailAddress')}" th:errors="*{emailAddress}">Email Error</h5></td>
							</tr>
							<tr>
								<td>Phone Number:</td><td><input type="text" th:field="*{phoneNumber}"></td><td><h5 style="color:red" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">Phone Number Error</h5></td>
							</tr>
							<tr>
								<td>User Name:</td><td><input type="text" th:field="*{username}"></td><td><h5 style="color:red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">User Name Error</h5></td>
							</tr>
							<tr>
								<td>Password:</td><td><input type="password" th:field="*{password}"></td><td><h5 style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</h5></td>
							</tr>
							<tr>
								<td colspan="2"><input type="submit" value="Submit" />
							</td>
						</table>
					</form>
			</div>
		</section>
		<br>
		<br>
		<br>
		<br>
		<br>
		<br>
		<br>
		<br>
		<br>
		<br>
		<br>
	<footer th:replace="~{layouts/common :: footer}"></footer>
</body>
</html>
