<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/common :: head('Register')}"></head>

<body>
    <header th:replace="~{layouts/common :: header}"></header>

    <main class="container">
        <section class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h2 mb-3">Register to GameForge</h1>

                        <form th:action="@{/doRegister}" th:object="${userModel}" method="post" novalidate>
                            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" role="alert">
                                <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Invalid input.</p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="firstName">First Name</label>
                                <input class="form-control" id="firstName" type="text" th:field="*{firstName}"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''"
                                       autocomplete="given-name" autofocus>
                                <div class="invalid-feedback" th:errors="*{firstName}">First name error</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="lastName">Last Name</label>
                                <input class="form-control" id="lastName" type="text" th:field="*{lastName}"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''"
                                       autocomplete="family-name">
                                <div class="invalid-feedback" th:errors="*{lastName}">Last name error</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="emailAddress">Email</label>
                                <input class="form-control" id="emailAddress" type="text" th:field="*{emailAddress}"
                                       th:classappend="${#fields.hasErrors('emailAddress')} ? 'is-invalid' : ''"
                                       autocomplete="email">
                                <div class="invalid-feedback" th:errors="*{emailAddress}">Email error</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="phoneNumber">Phone Number</label>
                                <input class="form-control" id="phoneNumber" type="text" th:field="*{phoneNumber}"
                                       th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                                       autocomplete="tel">
                                <div class="invalid-feedback" th:errors="*{phoneNumber}">Phone number error</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control" id="username" type="text" th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                       autocomplete="username">
                                <div class="invalid-feedback" th:errors="*{username}">Username error</div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control" id="password" type="password" th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{password}">Password error</div>
                            </div>

                            <button class="btn btn-primary w-100" type="submit">Register</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{layouts/common :: footer}"></footer>
</body>
</html>
